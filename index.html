<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AROMANIA — Essence of Elegance</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050505;
    color:#fff;
    font-family:"DM Sans",sans-serif;
    overflow-x:hidden;
}

a{
    text-decoration:none;
    color:inherit;
}

button{
    font-family:inherit;
}


/* HEADER */

.header{

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:82px;

    z-index:100;

    display:flex;

    align-items:center;
    justify-content:space-between;

    padding:0 22px;

    border-bottom:
    1px solid rgba(255,255,255,.12);

}


/* LOGO */

.logo{
    text-align:center;
}

.logo-main{

    font-family:
    "Cormorant Garamond",serif;

    font-size:30px;

    letter-spacing:6px;

    font-weight:600;

}

.logo-sub{

    margin-top:5px;

    font-size:7px;

    letter-spacing:3px;

    color:#c7a46a;

    text-transform:uppercase;

}


/* NAV */

.nav{

    display:none;

}


/* ACTIONS */

.actions{

    display:flex;

    gap:8px;

}

.icon-btn{

    width:38px;
    height:38px;

    border-radius:50%;

    border:1px solid
    rgba(255,255,255,.25);

    background:rgba(0,0,0,.25);

    color:#fff;

    display:flex;

    align-items:center;
    justify-content:center;

}


/* HERO */

.hero{

    position:relative;

    width:100%;

    height:100svh;

    min-height:650px;

    overflow:hidden;

    background:#080808;

}


/* VIDEO */

.hero-video{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    border:0;

    object-fit:cover;

    transform:scale(1.08);

}


/* OVERLAY */

.hero-overlay{

    position:absolute;

    inset:0;

    z-index:2;

    background:

    linear-gradient(
        to bottom,
        rgba(0,0,0,.72),
        rgba(0,0,0,.15) 45%,
        rgba(0,0,0,.90)
    );

}


/* HERO CONTENT */

.hero-content{

    position:relative;

    z-index:5;

    height:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:90px 20px 50px;

}


.eyebrow{

    font-size:9px;

    letter-spacing:4px;

    color:#d7c5a7;

    text-transform:uppercase;

    margin-bottom:20px;

}


.brand{

    font-family:
    "Cormorant Garamond",serif;

    font-size:
    clamp(55px,17vw,110px);

    font-weight:500;

    letter-spacing:8px;

    line-height:.8;

}


.brand-sub{

    margin-top:20px;

    font-size:8px;

    letter-spacing:5px;

    color:#d5d0c9;

}


.tagline{

    margin-top:28px;

    font-family:
    "Cormorant Garamond",serif;

    font-size:24px;

    font-style:italic;

    color:#e8dfd2;

}


.hero-text{

    max-width:330px;

    margin-top:12px;

    font-size:11px;

    line-height:1.8;

    color:#aaa59e;

}


.hero-btn{

    margin-top:28px;

    padding:15px 28px;

    border:1px solid #c7a46a;

    background:#c7a46a;

    color:#080808;

    font-size:9px;

    letter-spacing:2px;

    text-transform:uppercase;

}


.scroll{

    position:absolute;

    bottom:25px;

    left:50%;

    transform:translateX(-50%);

    z-index:5;

    font-size:8px;

    letter-spacing:3px;

    color:#aaa;

}


/* DESKTOP */

@media(min-width:800px){

    .header{
        padding:0 60px;
    }

    .nav{

        display:flex;

        gap:35px;

    }

    .nav a{

        font-size:10px;

        letter-spacing:2px;

        text-transform:uppercase;

        color:#ddd;

    }

    .brand{

        font-size:130px;

    }

}

</style>

</head>

<body>


<header class="header">

    <a href="#home" class="logo">

        <div class="logo-main">
            AROMANIA
        </div>

        <div class="logo-sub">
            Essence Of Elegance
        </div>

    </a>


    <nav class="nav">

        <a href="#home">Home</a>

        <a href="#collection">Collection</a>

        <a href="#about">Our Story</a>

        <a href="#reviews">Reviews</a>

    </nav>


    <div class="actions">

        <button class="icon-btn">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>

        <button class="icon-btn">
            <i class="fa-solid fa-bag-shopping"></i>
        </button>

    </div>

</header>


<section class="hero" id="home">


    <iframe

        class="hero-video"

        src="https://www.youtube.com/embed/o7GuykLJqUw?autoplay=1&mute=1&loop=1&playlist=o7GuykLJqUw&controls=0&playsinline=1&rel=0"

        allow="autoplay; encrypted-media"

        title="Perfume Background Video">

    </iframe>


    <div class="hero-overlay"></div>


    <div class="hero-content">

        <div class="eyebrow">
            The Art Of Fragrance
        </div>


        <h1 class="brand">
            AROMANIA
        </h1>


        <div class="brand-sub">
            ESSENCE OF ELEGANCE
        </div>


        <div class="tagline">
            Scents that define you.
        </div>


        <p class="hero-text">

            Discover long-lasting fragrances
            created for unforgettable moments.

        </p>


        <a href="#collection"
           class="hero-btn">

            Explore Collection
            &nbsp; →

        </a>

    </div>


    <div class="scroll">
        SCROLL TO DISCOVER
    </div>


</section>
